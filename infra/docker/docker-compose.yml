name: relay-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_dev_password
      POSTGRES_DB: relay
    ports:
      - '5432:5432'
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: relay
      MINIO_ROOT_PASSWORD: relay_dev_password
    ports:
      - '9000:9000' # API S3-compatível
      - '9001:9001' # console web
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # LiveKit self-hosted (Fase 5 — voz/vídeo/tela via WebRTC). Chave/segredo
  # fixos ("devkey"/"secret", em livekit.yaml) e sem TLS — só para
  # desenvolvimento local. Em produção, gerar chaves próprias e rodar atrás
  # de TLS de verdade (ver docs do LiveKit).
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7880:7880' # HTTP/WebSocket (sinalização)
      - '7881:7881' # RTC sobre TCP (fallback)
      - '51000-51100:51000-51100/udp' # mídia RTC (faixa reduzida para dev local)
